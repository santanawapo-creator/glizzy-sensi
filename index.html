<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLIZZY PANEL</title>
<style>
body {
  background: #080808;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
#panel {
  display: none;
  background: #171717;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 25px;
  width: 270px;
  text-align: center;
  box-shadow: 0 0 25px #333;
}
h2 { letter-spacing: 3px; }
.option {
  background: #252525;
  padding: 15px;
  margin: 15px 0;
  border-radius: 9px;
}
button {
  background: #292929;
  color: white;
  border: 1px solid #555;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}
.status { color: #aaa; }
#hint { color: #777; font-size: 12px; }
</style>
</head>
<body>

<div id="panel">
  <h2>GLIZZY PANEL</h2>
  <p class="status">ANDROID EDITION</p>

  <div class="option">
    🎯 AUTO APUNTADO
    <p id="aim">APAGADO</p>
    <button onclick="toggleAim()">PRENDER / APAGAR</button>
  </div>

  <button onclick="closePanel()">CERRAR PANEL</button>
</div>

<p id="hint">Toca tres veces para abrir el panel</p>

<script>
let taps = 0;
let timer;

document.addEventListener("pointerdown", () => {
  taps++;

  clearTimeout(timer);
  timer = setTimeout(() => taps = 0, 700);

  if (taps >= 3) {
    document.getElementById("panel").style.display = "block";
    document.getElementById("hint").style.display = "none";
    taps = 0;
  }
});

function toggleAim() {
  let aim = document.getElementById("aim");
  aim.textContent =
    aim.textContent === "APAGADO" ? "ENCENDIDO" : "APAGADO";
}

function closePanel() {
  document.getElementById("panel").style.display = "none";
  document.getElementById("hint").style.display = "block";
}
</script>

</body>
</html>
<button id="togglePanel" onclick="togglePanel()">
  ENCENDER
</button>

<script>
  let panelActivo = false;

  function togglePanel() {
    panelActivo = !panelActivo;

    const boton = document.getElementById("togglePanel");

    boton.textContent = panelActivo ? "APAGAR" : "ENCENDER";
    boton.style.background = panelActivo ? "#c62828" : "#16834d";
  }
</script>

<style>
  #togglePanel {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    color: white;
    background: #16834d;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
